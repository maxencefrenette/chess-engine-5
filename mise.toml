[tools]
rust = "1.95.0"

[tasks.test]
description = "Run the Rust workspace tests"
run = "cargo test --workspace --locked"

[tasks.lint]
description = "Run Clippy and project-specific Rust lints"
run = [
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo run --locked -p chess-lints",
]

[tasks.with-cuda]
hide = true
tools = { "conda:cuda-toolkit" = { version = "13.2.2", channel = "conda-forge" } }
run = """
set -eu
CUDA_HOME="$(mise where conda:cuda-toolkit@13.2.2)"
export CUDA_HOME
export PATH="$CUDA_HOME/bin:$PATH"
export LD_LIBRARY_PATH="$CUDA_HOME/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
exec
"""

[tasks.eval-model]
description = "Evaluate a candidate checkpoint against a baseline on CUDA"
run = "mise run with-cuda -- cargo run --release --locked -p chess-engine --features cuda -- eval-model"

[tasks.train]
description = "Train a model using the training configuration"
run = "mise run with-cuda -- cargo run --locked -p chess-trainer --features cuda --"

[tasks.datagen]
description = "Generate self-play games and write Parquet shards"
run = "mise run with-cuda -- cargo run --release --locked -p chess-engine --features cuda -- self-play"
