output_dir = "/data/chess/chess-engine-5/models/smolgen-experiment"
device = "cuda"
batch_size = 128
seed = 42
value_sample_rate = 1.0

[[curriculum]]
dataset = "/data/chess/chess-engine-5/training-data/v2/1794316173826234974-1165184"
num_positions = 250301
epochs = 15.4147

[optimizer]
kind = "adamw"
learning_rate = 0.001
beta1 = 0.9
beta2 = 0.999
eps = 1e-08
weight_decay = 0.01
schedule = { mode = "constant" }

[model]
width = 64
heads = 4
layers = 1
