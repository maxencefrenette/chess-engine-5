output_dir = "/data/chess/chess-engine-5/models/smolgen-experiment"
device = "cuda"
dataset = "/data/chess/chess-engine-5/training-data/v1/1794179515052280911-75339/part-00000.parquet"
# After each pass over the selected positions, reshuffle and start a new epoch
# until the optimizer_steps budget is exhausted.
train_positions = 182378
optimizer_steps = 7125
batch_size = 128
seed = 42

[optimizer]
kind = "adamw"
learning_rate = 0.001
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
weight_decay = 0.01
schedule = { mode = "constant" }

[model]
width = 64
heads = 4
layers = 2
ffn_width = 128
policy_width = 32

[model.smolgen]
mode = "enabled"
compression = 2
hidden = 64
head_width = 8
