[package]
name = "chess-engine"
version = "0.1.0"
edition.workspace = true

[dependencies]
arrow-array = "58"
arrow-schema = "58"
parquet = { version = "58", default-features = false, features = ["arrow", "zstd"] }
rand = "0.9"
rand_chacha = "0.9"
rayon = "1"
serde_json = "1"
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
chess-network = { path = "../network", optional = true }

[features]
neural = ["dep:candle-core", "dep:candle-nn", "dep:chess-network"]
cuda = ["neural", "chess-network/cuda"]
